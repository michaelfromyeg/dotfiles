# mise is the single version manager (see the Languages section of .shellrc).
# Synced to ~/.config/mise/config.toml by `dotfiles env`.

[tools]
node = "lts"
# Keep pnpm available when a repository switches the active Node version.
pnpm = "10.34.5"
erlang = "latest"
elixir = "latest"
ruby = "latest"

[settings]
# Honor per-repo .nvmrc / .node-version files (notion-next, rowspace, ...)
idiomatic_version_file_enable_tools = ["node"]
